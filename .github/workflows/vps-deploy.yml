name: VPS Deploy

# Manual-only deploy for a LIVE real-money trading system.
# Deliberately NOT triggered on push to main — a production deploy must be an
# explicit, typed operator action. Protects against accidental deploys when the
# SSH_PRIVATE_KEY secret is later configured.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY to confirm a live production deploy"
        required: true
        default: "no"

# Never run two deploys at once — a rolling restart must be serialized.
concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Optional: gate behind a GitHub `production` environment with required
    # reviewers (Settings → Environments → production → Required reviewers).
    environment: production
    if: ${{ github.event.inputs.confirm == 'DEPLOY' }}

    steps:
      - uses: actions/checkout@v4

      - name: Fail closed if deploy secrets are missing
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
            echo "::error::SSH_PRIVATE_KEY is not configured."
            missing=1
          fi
          if [ -z "${SSH_HOST:-}" ]; then
            echo "::error::SSH_HOST is not configured (no hardcoded host fallback)."
            missing=1
          fi
          if [ -z "${SSH_USER:-}" ]; then
            echo "::error::SSH_USER is not configured (no root fallback)."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Configure Settings → Secrets and variables → Actions, or deploy on the VPS."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "${{ secrets.SSH_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
            chmod 644 ~/.ssh/known_hosts
          else
            echo "::error::SSH_KNOWN_HOSTS is required. Pin the host key; do not use accept-new."
            exit 1
          fi

      - name: Deploy to VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${SSH_USER}@${SSH_HOST}" 'bash -s' << 'REMOTE'
          set -euo pipefail
          PROJECT_DIR="${PROJECT_DIR:-/root/ai-trading-platform-v3}"
          cd "$PROJECT_DIR"
          git fetch origin main && git checkout main && git pull origin main
          git log -1 --oneline
          chmod +x scripts/hostinger_vps_apply.sh scripts/lib/vps_ssh_hygiene.sh 2>/dev/null || true
          PROJECT_DIR="$PROJECT_DIR" ./scripts/hostinger_vps_apply.sh
          REMOTE
