# Standalone SearXNG that joins the existing trading-net.
# Safe to `docker compose up -d` without rebuilding the trading backend.
#
# Usage (VPS):
#   cd /root/ai-trading-platform-v3/searxng
#   # set SEARXNG_SECRET in .env (or inherit from ../.env)
#   docker compose up -d
#
# Agents:  http://ai-trading-searxng:8080/search?q=...&format=json
# Host:    http://127.0.0.1:8888/search?q=...&format=json
# Do not publish 8080 on 0.0.0.0 — public JSON search is abused as a proxy.

name: ai-trading-searxng

services:
  searxng-valkey:
    image: docker.io/valkey/valkey:8-alpine
    container_name: ai-trading-searxng-valkey
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    networks:
      - trading-net
    volumes:
      - searxng-valkey-data:/data
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  searxng:
    image: ghcr.io/searxng/searxng:2026.9.8-3fdc6d753
    container_name: ai-trading-searxng
    restart: unless-stopped
    depends_on:
      - searxng-valkey
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://ai-trading-searxng:8080/}
      SEARXNG_SECRET: ${SEARXNG_SECRET:?SEARXNG_SECRET must be set}
      SEARXNG_VALKEY_URL: redis://searxng-valkey:6379/0
    volumes:
      - ./core-config:/etc/searxng:rw
      - searxng-cache:/var/cache/searxng
    networks:
      - trading-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

networks:
  trading-net:
    external: true

volumes:
  searxng-cache:
  searxng-valkey-data:
