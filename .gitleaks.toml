title = "quantumtrade-pro"

[extend]
useDefault = true

[[rules]]
id = "burned-admin-fallback"
description = "Hardcoded admin API fallback previously shipped in the frontend"
regex = '''39b2487d5386c4fd52e258721a2170915797f7280b8b0afc'''
tags = ["key", "quantumtrade"]

  [[rules.allowlists]]
  description = "Keep the burned value only in the deny-list and this config"
  paths = [
    '''(^|/)scripts/ci/forbidden_substrings\.txt$''',
    '''(^|/)\.gitleaks\.toml$''',
  ]

# gitleaks 8.24.3 (the version CI pins) unmarshals a singular [allowlist]
# only. Array [[allowlists]] is ignored until 8.25.0. Do not path-exclude
# all of .env.example — keep placeholders on a regex allowlist so a real
# key pasted into the example file still fails the working-tree scan.
[allowlist]
description = "Documented placeholders and the scanner's own deny-list"
regexTarget = "match"
regexes = [
  '''your_[A-Za-z0-9_]+_here''',
  '''change-me-strong-password''',
  '''sk-local-litellm-key''',
]
paths = [
  '''(^|/)scripts/ci/forbidden_substrings\.txt$''',
  '''(^|/)\.gitleaks\.toml$''',
]
