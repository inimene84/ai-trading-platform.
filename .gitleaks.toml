title = "quantumtrade-pro"

[extend]
useDefault = true

[[rules]]
id = "burned-admin-fallback"
description = "Hardcoded admin API fallback previously shipped in the frontend"
regex = '''39b2487d5386c4fd52e258721a2170915797f7280b8b0afc'''
tags = ["key", "quantumtrade"]

[[rules]]
id = "jesse-dashboard-password"
description = "Jesse dashboard password previously hardcoded as a code default and pasted in walkthrough docs"
regex = '''QuantumTrading2026'''
tags = ["password", "quantumtrade", "jesse"]

[[rules]]
id = "jesse-postgres-password"
description = "Jesse PostgreSQL password pasted in walkthrough docs"
regex = '''jesse_secure_pass_[0-9]+'''
tags = ["password", "quantumtrade", "jesse"]

# Allowlists are independent rules (OR semantics). Keep deny-list files
# path-allowlisted so the needles they must contain do not self-flag.
[[allowlists]]
description = "Deny-list and config files that legitimately contain the needles"
paths = [
  '''(^|/)\.env\.example$''',
  '''(^|/)n8n/\.env\.example$''',
  '''(^|/)scripts/ci/forbidden_substrings\.txt$''',
  '''(^|/)\.gitleaks\.toml$''',
]

[[allowlists]]
description = "Documented placeholders"
regexTarget = "match"
regexes = [
  '''your_[A-Za-z0-9_]+_here''',
  '''change-me-strong-password''',
  '''sk-local-litellm-key''',
]
